name: memorypal

services:
  stt:
    image: memorypal-stt:local
    build:
      context: .
      dockerfile: deploy/docker/stt.Dockerfile
      args:
        MODEL_BASE_IMAGE: ${MEMORYPAL_MODEL_BASE_IMAGE:-python:3.12-slim-bookworm}
        TORCH_INDEX_URL: ${MEMORYPAL_TORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}
    restart: unless-stopped
    environment:
      MEMORYPAL_MODEL_SERVICE_TOKEN: ${MEMORYPAL_MODEL_SERVICE_TOKEN:?Set MEMORYPAL_MODEL_SERVICE_TOKEN in the Docker env file}
      MEMORYPAL_STT_DEVICE: ${MEMORYPAL_STT_DEVICE:-auto}
      MEMORYPAL_STT_MODEL: ${MEMORYPAL_STT_MODEL:-turbo}
      MEMORYPAL_STT_MODEL_DIR: /models/whisper
    ports:
      - 127.0.0.1:${MEMORYPAL_STT_PORT:-8001}:8001
    volumes:
      - memorypal_stt_models:/models/whisper
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=5)"]
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 30m
    networks:
      - memorypal_data

  monitor-stt:
    image: memorypal-monitor:local
    restart: unless-stopped
    pid: "service:stt"
    network_mode: "service:stt"
    depends_on:
      stt:
        condition: service_healthy
    environment:
      MEMORYPAL_MODEL_SERVICE_TOKEN: ${MEMORYPAL_MODEL_SERVICE_TOKEN:?Set MEMORYPAL_MODEL_SERVICE_TOKEN in the Docker env file}
    command: ["--service", "stt", "--host", "0.0.0.0", "--port", "8100", "--target-pid", "1", "--health-url", "http://127.0.0.1:8001/health", "--log-path", "/logs/stt.hardware.jsonl"]

  tts:
    image: memorypal-tts:local
    build:
      context: .
      dockerfile: deploy/docker/tts.Dockerfile
      args:
        MODEL_BASE_IMAGE: ${MEMORYPAL_MODEL_BASE_IMAGE:-python:3.12-slim-bookworm}
        TORCH_INDEX_URL: ${MEMORYPAL_TORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}
    restart: unless-stopped
    depends_on:
      archive:
        condition: service_healthy
    environment:
      MEMORYPAL_MODEL_SERVICE_TOKEN: ${MEMORYPAL_MODEL_SERVICE_TOKEN:?Set MEMORYPAL_MODEL_SERVICE_TOKEN in the Docker env file}
      MEMORYPAL_TTS_DEVICE: ${MEMORYPAL_TTS_DEVICE:-auto}
      MEMORYPAL_TTS_ENGINE: ${MEMORYPAL_TTS_ENGINE:-auto}
      MEMORYPAL_TTS_DTYPE: ${MEMORYPAL_TTS_DTYPE:-auto}
      MEMORYPAL_TTS_PUBLIC_URL: ${MEMORYPAL_TTS_PUBLIC_URL:-http://127.0.0.1:8003}
      MEMORYPAL_TTS_REFERENCE_UPLOAD_DIR: /tmp/memorypal-reference
      MEMORYPAL_TTS_REFERENCE_AUDIO_ROOTS: /tmp/memorypal-reference:/data/private-voice-uploads:/app/backend/archive_service/voice_uploads:/app/backend/TTS_Server/reference_audio
      HF_HOME: /models/huggingface
    ports:
      - 127.0.0.1:${MEMORYPAL_TTS_PORT:-8003}:8003
    volumes:
      - memorypal_tts_models:/models/huggingface
      - memorypal_tts_outputs:/app/backend/TTS_Server/outputs
      - memorypal_archive_private_voice:/data/private-voice-uploads:ro
      - memorypal_archive_public_voice:/app/backend/archive_service/voice_uploads:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/health', timeout=5)"]
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 30m
    networks:
      - memorypal_data

  monitor-tts:
    image: memorypal-monitor:local
    restart: unless-stopped
    pid: "service:tts"
    network_mode: "service:tts"
    depends_on:
      tts:
        condition: service_healthy
    environment:
      MEMORYPAL_MODEL_SERVICE_TOKEN: ${MEMORYPAL_MODEL_SERVICE_TOKEN:?Set MEMORYPAL_MODEL_SERVICE_TOKEN in the Docker env file}
    command: ["--service", "tts", "--host", "0.0.0.0", "--port", "8102", "--target-pid", "1", "--health-url", "http://127.0.0.1:8003/health", "--log-path", "/logs/tts.hardware.jsonl"]

  gateway:
    environment:
      MEMORYPAL_STT_URL: http://stt:8001
      MEMORYPAL_TTS_URL: http://tts:8003
    depends_on:
      stt:
        condition: service_healthy
      tts:
        condition: service_healthy

  worker:
    environment:
      MEMORYPAL_STT_URL: http://stt:8001
      MEMORYPAL_TTS_URL: http://tts:8003

volumes:
  memorypal_stt_models:
  memorypal_tts_models:
  memorypal_tts_outputs:
