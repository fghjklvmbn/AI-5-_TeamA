name: memoripal
description: 메모리팔 - 나만의 비밀 친구, 언제나 곁에서 ♡
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter

  # 상태 관리
  flutter_bloc: ^8.1.4
  equatable: ^2.0.5

  # 네트워크
  dio: ^5.4.0
  web_socket_channel: ^2.4.4

  # 오디오 녹음
  record: ^5.1.0
  just_audio: ^0.9.36
  permission_handler: ^11.3.0

  # 로컬 저장
  shared_preferences: ^2.2.2
  path_provider: ^2.1.2

  # UI
  flutter_animate: ^4.5.0
  flutter_svg: ^2.0.10+1
  google_fonts: ^6.1.0
  shimmer: ^3.0.0
  lottie: ^3.1.0
  gap: ^3.0.1

  # 유틸
  intl: ^0.19.0
  uuid: ^4.3.3
  logger: ^2.0.2+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/
  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Regular.ttf
          weight: 400
        - asset: assets/fonts/Pretendard-Medium.ttf
          weight: 500
        - asset: assets/fonts/Pretendard-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Pretendard-Bold.ttf
          weight: 700