[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memorypal-gateway"
version = "0.1.0"
description = "MemoryPal authentication, memory, and AI pipeline gateway"
requires-python = ">=3.12,<3.13"
dependencies = [
  "ddgs>=9.14,<10",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "python-dotenv>=1.0,<2",
  "python-multipart>=0.0.9,<1",
  "pypdf>=5,<7",
  "psycopg[binary,pool]>=3.2,<4",
  "redis>=5,<7",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.2,<9"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["memorypal_api*"]
exclude = ["data*", "tests*"]

[tool.ruff]
target-version = "py312"
line-length = 100
